[workspace]
resolver = "2"
members = ["crates/zhi-core", "crates/zhi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
thiserror = "2"
anyhow = "1"
